splay:swap}@font-face{font-family:"Source Han Serif TC";src:url("https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-serif@release/OTF/TraditionalChinese/SourceHanSerifTC-Light.otf") format("opentype");font-style:normal;font-weight:300;font-display:swap}@font-face{font-family:"Source Han Serif TC";src:url("https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-serif@release/OTF/TraditionalChinese/SourceHanSerifTC-Regular.otf") format("opentype");font-style:normal;font-weight:400;font-display:swap}@font-face{font-family:"Source Han Serif TC";src:url("https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-serif@release/OTF/TraditionalChinese/SourceHanSerifTC-Medium.otf") format("opentype");font-style:normal;font-weight:500;font-display:swap}@font-face{font-family:"Source Han Serif TC";src:url("https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-serif@release/OTF/TraditionalChinese/SourceHanSerifTC-SemiBold.otf") format("opentype");font-style:normal;font-weight:600;font-display:swap}@font-face{font-family:"Source Han Serif TC";src:url("https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-serif@release/OTF/TraditionalChinese/SourceHanSerifTC-Bold.otf") format("opentype");font-style:normal;font-weight:700;font-display:swap}@font-face{font-family:"Source Han Serif TC";src:url("https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-serif@release/OTF/TraditionalChinese/SourceHanSerifTC-Heavy.otf") format("opentype");font-style:normal;font-weight:900;font-display:swap}.lang-zh p,.field-sinica{font-family:"Source Han Serif TC","Noto Serif CJK TC",serif}.glyph .hanzi-tc{font-family:"Source Han Serif TC","Noto Serif CJK TC",serif;font-feature-settings:"locl" 1}</style><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="logo.png"><link rel="apple-touch-icon" href="logo.png"><meta property="og:image" content="logo.png"></head><body><header><div class="wrap top"><a class="brand" href="index.html"><img src="logo.png" alt="漢字 — insigne dictionarii">Dictionarium Sancti Nicolai</a><nav><a href="index.html" aria-current="page">Lexicon vocabulorum</a><a href="znaki.html" >Lexicon characterum</a></nav></div></header><main class="wrap"><section class="hero"><h1>Lexicon vocabulorum</h1><p>Significationes, pronuntiationes atque usum vocabulorum in quinque linguis reperi.</p><form class="search" id="form"><input id="q" placeholder="Characterem, lectionem vel significationem inscribe…" aria-label="Quaere"><button>Quaere</button></form></section><section id="detail"></section><h2 id="heading">Vocabula perlustra</h2><div class="cards" id="cards"></div><p id="empty" class="hidden">Nulla inventa sunt.</p></main><footer class="site-footer"><div class="wrap">Auctor huius dictionarii <a href="https://antonisofron.github.io/antonisofron/" target="_blank" rel="noopener noreferrer">Antonius Sofronus</a> est.</div></footer><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="data.js"></script><script>const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();$("#form").onsubmit=e=>{e.preventDefault();render()};$("#q").oninput=render;let items=CHANDZI.words;const selectedVariant=new WeakMap();
function variantsOf(w){return w.variants&&w.variants.length?w.variants:[w.t]}
function currentVariant(w){return selectedVariant.get(w)||0}
function hanziHTML(value){return [...String(value)].map(ch=>(ch==="青"||ch==="隹")?'<span class="hanzi-tc" lang="zh-Hant">'+esc(ch)+'</span>':esc(ch)).join("")}
function glyphPicker(w,detail=false){
 const variants=variantsOf(w),index=currentVariant(w);
 if(variants.length===1)return '<div class="glyph" lang="ko">'+hanziHTML(variants[0])+'</div>';
 return '<div class="variant-picker"><button type="button" class="variant-arrow" data-step="-1" aria-label="Forma prior">‹</button><div class="glyph" lang="ko">'+hanziHTML(variants[index])+'</div><button type="button" class="variant-arrow" data-step="1" aria-label="Forma sequens">›</button></div><div class="variant-count">'+(index+1)+' / '+variants.length+'</div>';
}
function attachPicker(container,w,update){
 container.querySelectorAll('.variant-arrow').forEach(button=>button.onclick=e=>{
  e.preventDefault();e.stopPropagation();
  const variants=variantsOf(w);
  selectedVariant.set(w,(currentVariant(w)+Number(button.dataset.step)+variants.length)%variants.length);
  update();
 });
}
function show(w){
 const labels={sl:"Slavonica",ja:"Japonica",ko:"Coreana",zh:"Sinica",vi:"Vietnamica"};
 const detail=$("#detail");
 function draw(){
 detail.innerHTML='<article class="detail"><button class="back" id="back">← Ad indicem redi</button>'+glyphPicker(w,true)+'<h2>'+esc(w.meaning)+'</h2><div class="languages">'+Object.entries(labels).map(([k,v])=>'<div class="lang lang-"+k+"><b>'+v+'</b><p><span class="'+(w.langs[k]===null?"no":w.langs[k]===undefined?"unknown":"yes")+'">'+(w.langs[k]===null?"−":w.langs[k]===undefined?"?":"+")+'</span> '+(w.langs[k]===null?"":w.langs[k]===undefined?"Nondum exploratum":esc(w.langs[k]))+'</p></div>').join("")+'</div></article>';
 $("#back").onclick=()=>detail.innerHTML="";
 attachPicker(detail,w,()=>{draw();render()});
 }
 draw();detail.scrollIntoView({behavior:"smooth"});
}
function render(){
 const q=norm($("#q").value.trim());
 const list=items.filter(w=>!q||norm([...(w.variants||[w.t]),w.s,w.meaning,...Object.values(w.langs)].join(" ")).includes(q));
 $("#cards").innerHTML="";
 $("#empty").classList.toggle("hidden",!!list.length);
 $("#heading").textContent=q?"Quaesita inventa":"Vocabula perlustra";
 list.forEach(w=>{
  const b=document.createElement("div");b.className="card word-card";b.tabIndex=0;b.setAttribute("role","button");
  const draw=()=>{b.innerHTML=glyphPicker(w)+'<b>'+esc(w.meaning)+'</b><p>'+esc(w.langs.sl??'')+'</p>';attachPicker(b,w,()=>{draw();if($("#detail").querySelector(".detail"))showWithoutScroll(w)})};
  b.onclick=e=>{if(!e.target.closest(".variant-arrow"))show(w)};
  b.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&e.target===b){e.preventDefault();show(w)}};
  draw();$("#cards").append(b);
 });
}
function showWithoutScroll(w){const detail=$("#detail");if(!detail.querySelector(".detail"))return;const active=detail.querySelector(".variant-picker .glyph");if(active){active.textContent=variantsOf(w)[currentVariant(w)];const count=detail.querySelector(".variant-count");if(count)count.textContent=(currentVariant(w)+1)+" / "+variantsOf(w).length}}
const initial=new URLSearchParams(location.search).get("q");if(initial)$("#q").value=initial;render();document.addEventListener("chandzi:loaded",()=>{items=CHANDZI.words;render();if(CHANDZI.error)$("#empty").textContent="Tabulae ex Google Sheets legi non potuerunt.";});</script></body></html>
