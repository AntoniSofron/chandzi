<!doctype html><html lang="la"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dictionarium Sancti Nicolai — Lexicon characterum</title><style>:root{font-family:Arial,sans-serif;background:#f8f5ef;color:#302821}*{box-sizing:border-box}body{margin:0}header{background:#fffdf9;border-bottom:1px solid #e5dcd0}.wrap{max-width:1020px;margin:auto;padding:0 24px}.top{display:flex;align-items:center;justify-content:space-between;min-height:86px;gap:20px}.brand{font:normal 500 clamp(18px,2.1vw,25px) Georgia,'Times New Roman',serif;letter-spacing:0;color:#a90100;text-decoration:none;white-space:nowrap}.brand img{width:48px;height:48px;object-fit:contain;vertical-align:middle;margin-right:10px;filter:none}nav{display:flex;gap:10px}nav a{color:#594c43;text-decoration:none;padding:12px 17px;border-radius:7px}nav a[aria-current=page]{background:#a90100;color:white}h1{font:normal clamp(36px,5vw,56px) Georgia,serif;margin:0 0 12px}h2{font:normal 28px Georgia,serif}p{color:#73675d;line-height:1.6}.hero{text-align:center;padding:68px 0 36px}.search{display:flex;max-width:700px;margin:25px auto 0;background:white;border:1px solid #d7cabc;border-radius:8px;overflow:hidden}.search input{flex:1;min-width:0;border:0;padding:20px;font-size:17px;outline:none}.search button{border:0;background:#a90100;color:white;padding:0 22px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card,.detail{background:#fffdf9;border:1px solid #e6dbcd;border-radius:10px;padding:22px}.card{text-align:left;cursor:pointer;color:inherit}.card:hover{border-color:#a72420}.glyph{font:normal 64px 'Noto Serif CJK SC','Songti SC',serif}.detail .glyph{font-size:92px}.muted{color:#817368}.detail{margin:25px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin:20px 0}.field{border-top:1px solid #e5dbcf;padding-top:12px}.field b{display:block;font-size:12px;color:#85756b;margin-bottom:8px;text-transform:uppercase}.languages{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.lang{padding:15px;border:1px solid #e6dbcd;border-radius:8px}.yes{color:#237b49;font-weight:bold}.no{color:#9b3b34;font-weight:bold}.unknown{color:#a17a31}.examples{display:flex;gap:10px;flex-wrap:wrap}.example{border:1px solid #ded1c4;background:white;padding:10px 14px;border-radius:6px;cursor:pointer;color:#5c342f}.back{background:none;border:0;color:#a72420;cursor:pointer;padding:0 0 15px}.hidden{display:none}@media(max-width:580px){.top{flex-wrap:wrap;padding-top:12px;padding-bottom:12px}nav a{padding:10px}.hero{padding-top:40px}}body::before{content:"";position:fixed;z-index:-1;pointer-events:none;top:105px;right:max(-45px,calc((100vw - 1450px)/2));height:min(86vh,850px);width:min(38vw,390px);background:#A90100;mask:url('Sanctus%20Nicolaus.png') center/contain no-repeat;-webkit-mask:url('Sanctus%20Nicolaus.png') center/contain no-repeat;opacity:.095}main{position:relative}@media(max-width:650px){body::before{right:-95px;width:260px;height:65vh;opacity:.055}}footer.site-footer{margin-top:42px;padding:22px 0;text-align:center;color:#786e65;font-size:14px;border-top:1px solid #e8d9c9}footer.site-footer a{color:inherit;text-decoration:underline;text-underline-offset:3px}.field .no{color:#9b3b34;font-weight:bold}</style><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="logo.png"><link rel="apple-touch-icon" href="logo.png"><meta property="og:image" content="logo.png"></head><body><header><div class="wrap top"><a class="brand" href="index.html"><img src="logo.png" alt="漢字 — insigne dictionarii">Dictionarium Sancti Nicolai</a><nav><a href="index.html" >Lexicon vocabulorum</a><a href="znaki.html" aria-current="page">Lexicon characterum</a></nav></div></header><main class="wrap"><section class="hero"><h1>Lexicon characterum</h1><p>Formas, claves et lectiones singulorum characterum cognosce.</p><form class="search" id="form"><input id="q" placeholder="Characterem, lectionem vel significationem inscribe…" aria-label="Quaere"><button>Quaere</button></form></section><section id="detail"></section><h2 id="heading">Vocabula perlustra</h2><div class="cards" id="cards"></div><p id="empty" class="hidden">Nulla inventa sunt.</p></main><footer class="site-footer"><div class="wrap">Auctor huius dictionarii <a href="https://antonisofron.github.io/antonisofron/" target="_blank" rel="noopener noreferrer">Antonius Sofronus</a> est.</div></footer><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="data.js"></script><script>const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();$("#form").onsubmit=e=>{e.preventDefault();render()};$("#q").oninput=render;let items=CHANDZI.characters;function show(c){const matches=CHANDZI.words.filter(w=>[...c.t,...c.s].some(ch=>w.t.includes(ch)||w.s.includes(ch)));const fields=[["Slavonica",c.sl??"Nondum exploratum"],["Japonica",c.ja],["Coreana",c.ko],["Sinica",c.pinyin],["Vietnamica",c.vi]];$("#detail").innerHTML='<article class="detail"><button class="back" id="back">← Ad indicem redi</button><div class="glyph">'+esc(c.t)+'</div>'+(c.radical?'<p>康熙部首: '+esc(c.radical)+(c.number?' · num. '+esc(c.number):'')+'</p>':'')+'<h2>'+esc(c.meaning)+'</h2><div class="grid">'+fields.map(([k,v])=>'<div class="field"><b>'+esc(k)+'</b>'+(v===null?'<span class="no">−</span>':esc(v??'Nondum exploratum'))+'</div>').join("")+'</div><h2>Exempla vocabulorum ex lexico</h2><div class="examples">'+(matches.length?matches.map(w=>'<a class="example" href="index.html?q='+encodeURIComponent(w.t)+'">'+esc(w.t)+' · '+esc(w.meaning)+'</a>').join(""):'<p>Nulla vocabula hunc characterem continent in lexico praesenti.</p>')+'</div></article>';$("#back").onclick=()=>$("#detail").innerHTML="";$("#detail").scrollIntoView({behavior:"smooth"})}function render(){const q=norm($("#q").value.trim()),list=items.filter(c=>!q||norm(Object.values(c).join(" ")).includes(q));$("#cards").innerHTML="";$("#empty").classList.toggle("hidden",!!list.length);$("#heading").textContent=q?"Quaesita inventa":"Characteres perlustra";list.forEach(c=>{const b=document.createElement("button");b.className="card";b.innerHTML='<div class="glyph">'+esc(c.t)+'</div><b>'+esc(c.meaning)+'</b><p>'+esc(c.sl??'')+'</p>';b.onclick=()=>show(c);$("#cards").append(b)})}render();document.addEventListener("chandzi:loaded",()=>{items=CHANDZI.characters;render();if(CHANDZI.error)$("#empty").textContent="Tabulae ex Google Sheets legi non potuerunt.";});</script></body></html>
