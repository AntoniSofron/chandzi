ht:200;font-display:swap}@font-face{font-family:"Source Han Serif TC";src:url("https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-serif@release/OTF/TraditionalChinese/SourceHanSerifTC-Light.otf") format("opentype");font-style:normal;font-weight:300;font-display:swap}@font-face{font-family:"Source Han Serif TC";src:url("https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-serif@release/OTF/TraditionalChinese/SourceHanSerifTC-Regular.otf") format("opentype");font-style:normal;font-weight:400;font-display:swap}@font-face{font-family:"Source Han Serif TC";src:url("https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-serif@release/OTF/TraditionalChinese/SourceHanSerifTC-Medium.otf") format("opentype");font-style:normal;font-weight:500;font-display:swap}@font-face{font-family:"Source Han Serif TC";src:url("https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-serif@release/OTF/TraditionalChinese/SourceHanSerifTC-SemiBold.otf") format("opentype");font-style:normal;font-weight:600;font-display:swap}@font-face{font-family:"Source Han Serif TC";src:url("https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-serif@release/OTF/TraditionalChinese/SourceHanSerifTC-Bold.otf") format("opentype");font-style:normal;font-weight:700;font-display:swap}@font-face{font-family:"Source Han Serif TC";src:url("https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-serif@release/OTF/TraditionalChinese/SourceHanSerifTC-Heavy.otf") format("opentype");font-style:normal;font-weight:900;font-display:swap}.lang-zh p,.field-sinica{font-family:"Source Han Serif TC","Noto Serif CJK TC",serif}</style><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="logo.png"><link rel="apple-touch-icon" href="logo.png"><meta property="og:image" content="logo.png"></head><body><header><div class="wrap top"><a class="brand" href="index.html"><img src="logo.png" alt="漢字 — insigne dictionarii">Dictionarium Sancti Nicolai</a><nav><a href="index.html" >Lexicon vocabulorum</a><a href="znaki.html" aria-current="page">Lexicon characterum</a></nav></div></header><main class="wrap"><section class="hero"><h1>Lexicon characterum</h1><p>Formas, claves et lectiones singulorum characterum cognosce.</p><form class="search" id="form"><input id="q" placeholder="Characterem, lectionem vel significationem inscribe…" aria-label="Quaere"><button>Quaere</button></form></section><section id="detail"></section><h2 id="heading">Vocabula perlustra</h2><div class="cards" id="cards"></div><p id="empty" class="hidden">Nulla inventa sunt.</p></main><footer class="site-footer"><div class="wrap">Auctor huius dictionarii <a href="https://antonisofron.github.io/antonisofron/" target="_blank" rel="noopener noreferrer">Antonius Sofronus</a> est.</div></footer><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="data.js"></script><script>const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();$("#form").onsubmit=e=>{e.preventDefault();render()};$("#q").oninput=render;let items=CHANDZI.characters;const selectedVariant=new WeakMap();
function variantsOf(c){return c.variants?.length?c.variants:[c.t]}
function current(c){return selectedVariant.get(c)||0}
function picker(c){
 const variants=variantsOf(c),i=current(c);
 if(variants.length===1)return '<div class="glyph" lang="zh-Hant">'+esc(variants[0])+'</div>';
 return '<div class="variant-picker"><button class="variant-arrow" type="button" data-step="-1" aria-label="Forma prior">‹</button><div class="glyph" lang="zh-Hant">'+esc(variants[i])+'</div><button class="variant-arrow" type="button" data-step="1" aria-label="Forma sequens">›</button></div><div class="variant-count">'+(i+1)+' / '+variants.length+'</div>';
}
function bindPicker(root,c,callback){
 root.querySelectorAll(".variant-arrow").forEach(btn=>btn.onclick=e=>{
  e.preventDefault();e.stopPropagation();
  selectedVariant.set(c,(current(c)+Number(btn.dataset.step)+variantsOf(c).length)%variantsOf(c).length);
  callback();
 });
}
function show(c){
 const matches=CHANDZI.words.filter(w=>variantsOf(c).some(ch=>[...(w.variants||[w.t])].some(form=>form.includes(ch))));
 const fields=[["Slavonica",c.sl],["Japonica",c.ja],["Coreana",c.ko],["Sinica",c.pinyin],["Vietnamica",c.vi]];
 const detail=$("#detail");
 function draw(){
 const radical=c.radicals?.[current(c)]??c.radical;
 detail.innerHTML='<article class="detail"><button class="back" id="back">← Ad indicem redi</button>'+picker(c)+(radical?'<p>康熙部首: '+esc(radical)+'</p>':'')+'<h2>'+esc(c.meaning)+'</h2><div class="grid">'+fields.map(([k,v])=>'<div class="field field-"+k.toLowerCase()+"><b>'+esc(k)+'</b>'+(v===null?'<span class="no">−</span>':esc(v??"Nondum exploratum"))+'</div>').join("")+'</div><h2>Exempla vocabulorum ex lexico</h2><div class="examples">'+(matches.length?matches.map(w=>'<a class="example" href="index.html?q='+encodeURIComponent(w.t)+'">'+esc(w.t)+' · '+esc(w.meaning)+'</a>').join(""):'<p>Nulla vocabula hunc characterem continent in lexico praesenti.</p>')+'</div></article>';
 $("#back").onclick=()=>detail.innerHTML="";
 bindPicker(detail,c,()=>{draw();render()});
 }
 draw();detail.scrollIntoView({behavior:"smooth"});
}
function render(){
 const q=norm($("#q").value.trim());
 const list=items.filter(c=>!q||norm([...(c.variants||[c.t]),...Object.values(c)].join(" ")).includes(q));
 $("#cards").innerHTML="";
 $("#empty").classList.toggle("hidden",!!list.length);
 $("#heading").textContent=q?"Quaesita inventa":"Characteres perlustra";
 list.forEach(c=>{
  const b=document.createElement("div");b.className="card character-card";b.tabIndex=0;b.setAttribute("role","button");
  function draw(){b.innerHTML=picker(c)+'<b>'+esc(c.meaning)+'</b><p>'+esc(c.sl??"")+'</p>';bindPicker(b,c,()=>{draw();const d=$("#detail");if(d.querySelector(".detail .variant-picker")){const g=d.querySelector(".variant-picker .glyph");if(g)g.textContent=variantsOf(c)[current(c)]}})}
  b.onclick=e=>{if(!e.target.closest(".variant-arrow"))show(c)};
  b.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&e.target===b){e.preventDefault();show(c)}};
  draw();$("#cards").append(b);
 });
}
render();document.addEventListener("chandzi:loaded",()=>{items=CHANDZI.characters;render();if(CHANDZI.error)$("#empty").textContent="Tabulae ex Google Sheets legi non potuerunt.";});</script></body></html>
